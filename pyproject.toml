[project]
name = "metadatarr"
version = "0.1.6-alpha"
description = "Parses Telegram announcements and publishes the torrents' UNIT3D metadata through Apprise"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "apprise==2.1.0",
    "cryptg==0.6.0",
    "loguru==0.7.3",
    "pydantic==2.14.2",
    "python-dotenv==1.2.2",
    "pyyaml==6.0.3",
    "requests==2.34.2",
    "telethon==1.45.0",
    "tzdata==2026.6",
]

[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest==9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
