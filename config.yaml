channel_indexers:
  # TG-CHANNEL-ID_MYINDEXER: MyIndexer
  # "1234567890": MyIndexer

group_topic_indexers:
  # TG-GROUP-TOPIC-ID_MYINDEXER: MyIndexer
  # "1234567890_1234": MyIndexer

chat_indexers:
  # TG-CHAT-ID_MYINDEXER: MyIndexer
  # "1234567890": MyIndexer

# Required for every indexer above. Used to look up the torrent's metadata in the indexer's UNIT3D API
indexer_api:
  # MyIndexer:
  #   url: https://tracker.example.org  # scheme + fqdn, no path
  #   api_key: MY_API_KEY
  #   rate_limit: 15  # optional, max lookups per minute
